name: gold-price-monitor
on:
  schedule:
    - cron: "*/3 * * * *"   # 每3分钟(GitHub可能限流至最低5分钟间隔)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 恢复提醒状态(保证档位只提醒一次)
        uses: actions/cache/restore@v4
        with:
          path: gold_state.json
          key: gold-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gold-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 监测金价并按规则推送
        env:
          GOLD_SENDKEY: ${{ secrets.GOLD_SENDKEY }}
        run: python3 gold_monitor.py
      - name: 保存提醒状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: gold_state.json
          key: gold-state-${{ github.run_id }}-${{ github.run_attempt }}
